# Portable DOSBox-X configuration for the 8086 assembly exercises.
# Keep this file at the root of the Git repository.
# Use run-dosbox-x.sh (Linux) or run-dosbox-x.bat (Windows).
# Tested against the option names documented for DOSBox-X 2026.10.01.

[sdl]
# Retain the fullscreen TrueType-text setup from the Linux configuration.
fullscreen = true
fullresolution = desktop
output = ttf
autolock = false

[dosbox]
# Make relative host paths resolve from this configuration's directory.
# Do not hardcode a Linux home folder or a Windows drive letter here.
working directory option = config

# Reflect host-side edits to assembly files without directory-cache surprises.
nocachedir = true
machine = svga_s3

[render]
aspect = false

[cpu]
# Course exercises target original 8086 instructions.
core = normal
cputype = 8086
cycles = auto

[autoexec]
@echo off
# A relative path works because 'working directory option = config'.
mount c "." -nocachedir
c:
# Place DOS versions of MASM.EXE and LINK.EXE under ./MASM/ on each host.
# Retain DOSBox-X's built-in utilities on the existing DOS PATH.
path c:\masm;%PATH%
